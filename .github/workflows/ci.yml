name: CI

# 這個專案的「測試」是三件事一起：型別對不對、分層規則有沒有被破壞、
# 單元測試過不過。只跑其中一項會漏掉另外兩項的問題，所以三項都跑。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 驗證（${{ matrix.os }}）
    # 兩個平台都跑：這個專案在 Windows 上開發，但 gateway 本身是跨平台的
    # （POSIX 上用 `ps` 找持有 session 檔的行程，Windows 上用系統租約）。
    # 只在一個平台跑測試，等於另一個平台完全沒被驗過。
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      # Bun 的版本要對齊上游 omp 的需求（>= 1.4.4）：上游的 package.json 寫著
      # `engines.bun: ">=1.4.4"`。
      - name: 安裝 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      # Linux 上需要 procps：server/orphans.ts 用 `ps` 列出行程，找持有 session 檔的
      # 那個行程。GitHub 的 ubuntu runner 已經有 procps，Docker 的精簡 bun 映像沒有。
      - name: 安裝 procps（POSIX 的行程表工具）
        if: runner.os != 'Windows'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends procps

      - name: 安裝依賴
        run: bun install --frozen-lockfile

      # 型別檢查要在 build 之前跑：前端有問題時先講清楚，不要讓 build 的錯誤訊息
      # 蓋掉真正的原因。
      - name: 型別檢查
        run: bun run check

      # 分層規則：只有 server/omp/ 與 shared/omp/ 知道 omp 的細節。
      # 這條規則一破，omp 改版時的相容性問題就會散落到整個 codebase。
      - name: 分層規則
        run: bun run lint:omp

      # 用 `bun run test` 而不是 `bun test`：逾時值只在 package.json 定義一份，
      # 這裡再寫一次就會有兩處可能不一致。
      # 逾時要放到 30 秒：有一批測試會真的起一個行程並完成一次完整的 RPC 握手，
      # 5 秒（bun 的預設）在慢一點的 CI runner 上不夠——不是測試壞掉，是預算太緊。
      - name: 單元測試
        run: bun run test

      - name: 建置前端
        run: bun run build

      # 產物必須真的能被讀出來——「建置成功」但 dist/index.html 缺一角的話，
      # 部署出去就是一片空白。
      - name: 檢查建置產物
        run: test -s dist/index.html

  # 桌機版的型別另外檢查：electron/ 是獨立的 tsconfig，不在上面的專案設定裡。
  electron-types:
    name: 驗證（Electron 型別）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Electron 程式碼的型別檢查
        run: bunx tsc --noEmit --project electron/tsconfig.json
