<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
		<title>ompDK</title>
		<link rel="manifest" href="/manifest.webmanifest" />
		<!-- Two values: Safari and Chrome both pick by the reader's theme. -->
		<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#1a1a19" media="(prefers-color-scheme: dark)" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="ompDK" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<link rel="icon" href="/icon.svg" />
		<script>
			try {
				const p = JSON.parse(localStorage.getItem("omp-web:prefs") || "{}");
				if (p.theme && p.theme !== "system") document.documentElement.setAttribute("data-theme", p.theme);
				if (p.fontSize) document.documentElement.setAttribute("data-font", p.fontSize);
				// Same rule as i18n/index.ts: an explicit choice wins, “follow the system” asks the
				// browser, and an install with no preference yet is Chinese.
				const pref = p.locale ?? "zh";
				const lang = (navigator.language || "").toLowerCase();
				// zh-TW and zh-HK read Traditional Chinese; the other Chinese locales read Simplified.
				const system = lang.startsWith("zh-tw") || lang.startsWith("zh-hk") ? "zh-Hant" : lang.startsWith("zh") ? "zh" : "en";
				const chosen = pref === "system" ? system : pref;
				document.documentElement.lang = chosen === "zh-Hant" ? "zh-TW" : chosen === "zh" ? "zh-CN" : "en";
			} catch {}
		</script>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
